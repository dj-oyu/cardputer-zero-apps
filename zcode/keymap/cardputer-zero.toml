  { code = 89, layer = "sym", pos = [2, 8], provisional = true },  # KEY_RO
  { code = 90, layer = "sym", pos = [3, 5], provisional = true },  # KEY_KATAKANA
  { code = 91, layer = "sym", pos = [3, 6], provisional = true },  # KEY_HIRAGANA
