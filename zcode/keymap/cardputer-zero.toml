# CardputerZero 本体キーボード (tca8418c) のキー配列。
#
# ドライバは Shift / Sym / Fn の状態に応じて 3 つの表 (通常 / Sym / Fn) を切り替え、
# 別のキーコードを送ってくる。ここには「キーコード → 論理キーと文字」を書く。
# コードと行列の位置 (pos = [行, 列]) は実機のデバイスツリー (linux,keymap /
# linux,keymap1 / linux,keymap2) から読んだもの。
#
#   code        evdev のキーコード
#   key         論理キー。1 文字ならその文字、それ以外は名前 (Enter, F5, Up, ...)。
#               省くと「対応が決まっていないキー」(Key::Unknown)
#   text        入力される文字。省くと、key が 1 文字ならその文字
#   shift       Shift を押しているときの文字。省くと、英字は大文字、それ以外は text
#   layer       どの表のキーか (normal / sym / fn)。表示用
#   pos         キーボード行列の [行, 列]。同じ pos の通常レイヤーのキーが、その物理キー
#   provisional true なら未確定 (キー確認モード `zcode --keytest` で確かめる)
#
# Sym レイヤーの記号は、ドライバが「記号ごとの枠」として決めたキーコードで届く
# （例: Sym+1 は KEY_LEFTBRACE=26 で届くが、意味は `!`）。対応は本体のランチャー
# （CardputerZero/launcher の cp0_keyboard_keymap.c）と、ドライバの付属ファイル
# /usr/share/keymaps/tca8418_keypad_m5stack_keymap.map（`keycode 26 = exclam` の形式）
# が正本。ここにはその表を写してある（2026-11-16、実機のファイルと一致を確認）。
# 実行時は、そのファイルがあれば読み直して上書きする（zc_input::Keymap::apply_driver_map）。

version = 1
device = "tca8418c"

modifiers = { shift = [42], ctrl = [29], alt = [56], sym = [383], fn = [389] }

keys = [
