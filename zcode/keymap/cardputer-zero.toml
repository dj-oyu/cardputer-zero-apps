  { code = 32, key = "d", pos = [2, 2] },
  { code = 33, key = "f", pos = [2, 3] },
  { code = 34, key = "g", pos = [2, 4] },
  { code = 35, key = "h", pos = [2, 5] },
  { code = 36, key = "j", pos = [2, 6] },
  { code = 37, key = "k", pos = [2, 7] },
  { code = 38, key = "l", pos = [2, 8] },
