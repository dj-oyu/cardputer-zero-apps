# zcode の外部ビルド（docs/stage3-design.md）。zcode 本体とは別のワークスペース。
#
# 分けている理由:
# - 実機側の zc-remote は ring（C とアセンブリ）・rustls・serde_json を使う。zcode 本体の
#   Cargo.lock と実行ファイルに混ぜない（zcode は pure Rust のまま）
# - プロファイルを分ける（zcode は fat LTO。こちらは thin LTO: fat LTO の aarch64 で toml の
#   パーサが異常終了した件が未解決なので、serde 系を fat LTO に入れない）
# - zcode の `cargo test --workspace` に ring のビルドを足さない
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
zc-wire = { path = "crates/zc-wire" }
# zcode 本体のワークスペースと共有する crate（どちらも pure Rust・依存は libc だけ）
zc-core = { path = "../crates/zc-core" }
zc-remote-ipc = { path = "../crates/zc-remote-ipc" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 実機側だけ: TLS（暗号は ring。ユーザーの決定 ①）・根の証明書の埋め込み・zstd の展開
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
ruzstd = "0.8"

# 実機用（zc-remote）。大きさ優先。
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
