[package]
name = "zc-remote"
description = "実機側のクライアント: CLI (build / check / test / run) と serve (UNIX ソケットで待つ)。tokio なし・自前の poll ループ"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zc_remote"
path = "src/lib.rs"

[[bin]]
name = "zc-remote"
path = "src/main.rs"

[dependencies]
zc-wire.workspace = true
zc-core.workspace = true
zc-remote-ipc.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
ruzstd.workspace = true
