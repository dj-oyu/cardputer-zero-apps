[package]
name = "zc-buildd"
description = "ビルド係の受付: 目録と中身を受け取り、cargo / gcc / npm / tsc のジョブを実行して、ログ・診断・成果物を流す (Cloudflare のコンテナと PC で同じもの)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zc_buildd"
path = "src/lib.rs"

[[bin]]
name = "zc-buildd"
path = "src/main.rs"

[dependencies]
zc-wire.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
