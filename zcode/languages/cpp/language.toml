# C++（.cpp .cc .cxx .hpp .hh .hxx）。色の付け方は VS Code の Dark+（cpp）に寄せてある。
# C（../c）を土台にして、C++ のキーワード・名前空間・生文字列を足した。`.h` は C のまま。
#
# 限界:
# - 生文字列 R"delim(...)delim" は、delim を覚えられない（後方参照が要る）。`R"(` か `R"x(` で
#   始まり、最初の `)` + 英数字 + `"` で終わるものとして塗る（本文に `)"` を含む形は途中で
#   終わって見える）。R の前置き（u8R・LR・uR・UR）も同じ
# - アウトラインは class / struct / union / namespace の行だけ（`enum class Foo` は名前が
#   `class` になるので enum は入れない）。関数の定義は戻り値の型の
#   後ろに名前が来る（`int main(`）ので、「行の最初の語がキーワード」という形式では拾えない
# - 型の色は [words] の型名・`_t` で終わる名前・大文字で始まり小文字を含む名前（Node）・
#   `::` の前の名前（std::）だけ。小文字の自作の型（`struct point` の使用側）は塗れない
# - テンプレートの山括弧 `<` `>` は演算子の色になる（比較と区別できない）
# - マクロの本文（#define の続き）は普通のコードとして塗る。行末の `\` で次の行へ続く
# - 数の桁区切り（1'000'000）は、`'` の後ろに英数字が続くものだけ数の一部とみなす
# - `.h` は C と C++ で見分けられないので C のままにしてある

name = "C++"
extensions = ["cpp", "cc", "cxx", "hpp", "hh", "hxx"]
line_comment = "//"
indent = "    "
# 実機に g++ があれば構文だけ確かめる（出力の形は gcc と同じ）。ビルド係（remote）は後で足す
check = "g++ -fsyntax-only -std=c++20 {file}"
# g++ の出力: `ファイル:行:桁: error: メッセージ`
check_pattern = '^(?:.*?):(\d+):(\d+): (?:fatal error|error|warning): (.*)$'
keywords = [
    "alignas", "alignof", "auto", "bool", "break", "case", "catch", "char", "class", "concept",
    "const", "consteval", "constexpr", "constinit", "continue", "co_await", "co_return",
    "co_yield", "decltype", "default", "delete", "do", "double", "else", "enum", "explicit",
    "export", "extern", "false", "final", "float", "for", "friend", "goto", "if", "inline",
    "int", "long", "mutable", "namespace", "new", "noexcept", "nullptr", "operator", "override",
    "private", "protected", "public", "requires", "return", "short", "signed", "sizeof",
    "static", "static_assert", "static_cast", "struct", "switch", "template", "this",
    "thread_local", "throw", "true", "try", "typedef", "typeid", "typename", "union",
    "unsigned", "using", "virtual", "void", "volatile", "while",
    "std", "string", "vector", "map", "unordered_map", "set", "array", "optional", "variant",
    "unique_ptr", "shared_ptr", "make_unique", "make_shared", "move", "cout", "cin", "endl",
    "size_t", "uint8_t", "uint16_t", "uint32_t", "uint64_t", "int8_t", "int16_t", "int32_t",
    "int64_t", "main", "printf",
]

[outline]
items = { class = "class", struct = "class", union = "class", namespace = "class" }
indent_width = 4

[variables]
ident = '[A-Za-z_][A-Za-z0-9_]*'

[words]
keyword = [
    "typedef", "struct", "union", "enum", "class", "namespace", "template", "typename", "using",
    "sizeof", "alignof", "alignas", "decltype", "typeid", "static", "extern", "const", "constexpr",
    "consteval", "constinit", "volatile", "mutable", "register", "inline", "virtual", "override",
    "final", "explicit", "friend", "operator", "noexcept", "new", "delete", "public", "private",
    "protected", "thread_local", "static_assert", "static_cast", "dynamic_cast", "const_cast",
    "reinterpret_cast", "concept", "requires", "auto", "export", "module", "import",
]
control = [
    "if", "else", "for", "while", "do", "switch", "case", "default", "break", "continue",
    "return", "goto", "try", "catch", "throw", "co_await", "co_return", "co_yield", "defined",
]
type = [
    "int", "char", "short", "long", "float", "double", "void", "signed", "unsigned", "bool",
    "wchar_t", "char8_t", "char16_t", "char32_t", "size_t", "ssize_t", "ptrdiff_t", "intptr_t",
    "uintptr_t", "nullptr_t", "string", "string_view", "vector", "map", "unordered_map", "set",
    "unordered_set", "array", "deque", "list", "pair", "tuple", "optional", "variant", "span",
    "unique_ptr", "shared_ptr", "weak_ptr", "function", "thread", "mutex", "atomic",
    "ostream", "istream", "FILE",
]
constant = [
    "NULL", "nullptr", "true", "false", "this", "EOF", "cout", "cin", "cerr", "endl",
    "EXIT_SUCCESS", "EXIT_FAILURE",
]

# class / struct / enum / union / namespace / typename の後ろは型名
[word_push]
class = "typename"
struct = "typename"
union = "typename"
enum = "typename"
namespace = "typename"
typename = "typename"

[default_token]
str = "string"
raw_str = "string"
block_comment = "comment"

[[contexts.main]]
# プリプロセッサ指令（行頭の # と指令名）。残りの行は pp で塗る
match = '^[ \t]*#[ \t]*[A-Za-z_]*'
token = "control"
push = "pp"
[[contexts.main]]
include = "expr"

[[contexts.expr]]
match = '//.*'
token = "comment"
[[contexts.expr]]
match = '/\*'
token = "comment"
push = "block_comment"
# 生文字列 R"delim(  （u8R・uR・UR・LR も）。終端は raw_str で近似する
[[contexts.expr]]
match = '(?:u8|u|U|L)?R"[A-Za-z0-9_]{0,16}\('
token = "string"
push = "raw_str"
# 文字列と文字（L / u / U / u8 の前置きは引用符の手前で見る）
[[contexts.expr]]
match = '(?:L|u8|u|U)'
followed_by = '''["']'''
token = "string"
[[contexts.expr]]
match = '"'
token = "string"
push = "str"
[[contexts.expr]]
match = '''\'(?:\\(?:x[0-9a-fA-F]+|[0-7]{1,3}|[^\n])|[^'\\\n])*\''''
token = "string"
# 名前空間・クラスの修飾（std::  Foo::）は型の色
[[contexts.expr]]
match = '{{ident}}'
followed_by = '[ \t]*::'
token = "type"
# 識別子
[[contexts.expr]]
match = '{{ident}}'
followed_by = '[ \t]*\('
token = "function"
words = true
[[contexts.expr]]
match = '{{ident}}_t'
followed_by = '[^A-Za-z0-9_]'
token = "type"
[[contexts.expr]]
match = '[A-Z]'
followed_by = '[^A-Za-z0-9_]'
token = "type"
[[contexts.expr]]
match = '[A-Z][A-Z0-9_]*'
followed_by = '[^A-Za-z0-9_]'
token = "constant"
words = true
[[contexts.expr]]
match = '[A-Z][A-Za-z0-9_]*'
token = "type"
words = true
[[contexts.expr]]
match = '[a-z_][A-Za-z0-9_]*'
token = "text"
words = true
# 数（0x1F・1e-3f・10UL・0b101・1.5・1'000 などをまとめて）
[[contexts.expr]]
match = '''(?:[0-9]|\.[0-9])(?:[eEpP][+-]|'[0-9A-Za-z]|[0-9A-Za-z_.])*'''
token = "number"
[[contexts.expr]]
match = '[-+*/%&|^~<>!=?]+'
token = "operator"
[[contexts.expr]]
match = '[(){}\[\],;:.#]'
token = "punctuation"
[[contexts.expr]]
match = '[ \t]+'
token = "text"

# #include <vector> の山括弧
# 行末（継続行 `\` を除く）で抜ける
[[contexts.pp]]
match = '\\\n'
token = "punctuation"
[[contexts.pp]]
match = '\n'
pop = true
[[contexts.pp]]
match = '<[A-Za-z0-9_./+-]+>'
token = "string"
[[contexts.pp]]
include = "expr"

# class / struct / enum の後ろ。`enum class Foo` の class・struct はキーワードのまま読み飛ばす
[[contexts.typename]]
match = '[ \t]+'
token = "text"
[[contexts.typename]]
match = '(?:class|struct)'
followed_by = '[^A-Za-z0-9_]'
token = "keyword"
[[contexts.typename]]
match = '{{ident}}'
token = "type"
pop = true
[[contexts.typename]]
match = ''
pop = true

[[contexts.block_comment]]
match = '\*/'
pop = true
[[contexts.block_comment]]
match = '[^*\n]+|\*'

# 文字列: 行末の `\` で次の行へ続く。閉じていなければ行末で終わる
[[contexts.str]]
match = '"'
pop = true
[[contexts.str]]
match = '\\(?:x[0-9a-fA-F]+|[0-7]{1,3}|.|\n)'
token = "escape"
[[contexts.str]]
match = '\n'
pop = true
# printf の書式（%d %5.2f %-8s %lu %%）
[[contexts.str]]
match = '%[-+ #0]*[0-9*]*(?:\.[0-9*]+)?(?:hh|h|ll|l|L|z|j|t)?[A-Za-z%]'
token = "constant"
[[contexts.str]]
match = '[^"\\%\n]+|%'

# 生文字列の本文: `)` + 英数字 + `"` で終わる（delim は覚えない）。複数行にまたがる
[[contexts.raw_str]]
match = '\)[A-Za-z0-9_]{0,16}"'
pop = true
[[contexts.raw_str]]
match = '[^)]+|\)'
