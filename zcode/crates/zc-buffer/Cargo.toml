[package]
name = "zc-buffer"
description = "zcode のテキストバッファ (rope)・カーソル/選択・undo・変更通知"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zc-core.workspace = true
# 行の区切りは LF だけにする（default-features を切る。CR・U+2028 などで行が
# 分かれると、他の crate の「行」とずれる）。pure Rust。
ropey = { version = "1.6", default-features = false }
