[package]
name = "zc-input"
description = "zcode の入力: evdev 読み取り・grab・モディファイア・キー配列・自前リピート"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# 実行時に TOML のキー配列を読む (Keymap::parse)。テストと道具用。
# 実機の実行ファイルには入れない (埋め込みの表は build.rs がビルド時に作る)。
parse = ["dep:toml", "dep:serde"]

[dependencies]
zc-core.workspace = true
libc.workspace = true
toml = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
toml.workspace = true
serde.workspace = true

[dev-dependencies]
zc-input = { path = ".", features = ["parse"] }
